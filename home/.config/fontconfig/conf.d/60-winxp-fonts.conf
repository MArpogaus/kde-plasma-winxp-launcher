<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Part of the Windows XP pack (GPL-2.0-or-later).
     Tahoma and Verdana as XP draws them: from 9 to 16 px (Tahoma 8 pt is
     11 px) hinted and without smoothing, as these fonts' own gasp tables
     ask; smaller and larger sizes stay smoothed. A font smoothing setting
     made in System Settings (fonts.conf) still takes precedence. -->
<fontconfig>
  <match target="font">
    <test name="family"><string>Tahoma</string></test>
    <test name="pixelsize" compare="more"><double>8</double></test>
    <test name="pixelsize" compare="less_eq"><double>16</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family"><string>Verdana</string></test>
    <test name="pixelsize" compare="more"><double>8</double></test>
    <test name="pixelsize" compare="less_eq"><double>16</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
