<svg xmlns="http://www.w3.org/2000/svg" width="18" height="19" viewBox="0 0 18 19">
  <!-- XP's round "show hidden icons" button, measured on a native XP
       screenshot: 18 x 19 px, dark rim at the top left, light at the bottom
       right, cyan highlight in the upper left, crisp white arrow -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2769"/>
      <stop offset="0.45" stop-color="#104992"/>
      <stop offset="0.6" stop-color="#4f79c5"/>
      <stop offset="1" stop-color="#bed1f3"/>
    </linearGradient>
    <linearGradient id="fill" x1="0.15" y1="0.1" x2="0.75" y2="0.95">
      <stop offset="0" stop-color="#96dbfc"/>
      <stop offset="0.4" stop-color="#6fcdfb"/>
      <stop offset="0.5" stop-color="#2fb0f1"/>
      <stop offset="0.56" stop-color="#119eee"/>
      <stop offset="1" stop-color="#1a7ee8"/>
    </linearGradient>
  </defs>
  <ellipse cx="9" cy="9.5" rx="9" ry="9.5" fill="url(#rim)"/>
  <ellipse cx="9" cy="9.5" rx="8" ry="8.5" fill="url(#fill)"/>
  <g fill="#ffffff" shape-rendering="crispEdges">
    <rect x="10" y="5" width="1" height="1"/>
    <rect x="9" y="6" width="1" height="1"/>
    <rect x="10" y="6" width="1" height="1"/>
    <rect x="11" y="6" width="1" height="1"/>
    <rect x="8" y="7" width="1" height="1"/>
    <rect x="9" y="7" width="1" height="1"/>
    <rect x="10" y="7" width="1" height="1"/>
    <rect x="7" y="8" width="1" height="1"/>
    <rect x="8" y="8" width="1" height="1"/>
    <rect x="9" y="8" width="1" height="1"/>
    <rect x="6" y="9" width="1" height="1"/>
    <rect x="7" y="9" width="1" height="1"/>
    <rect x="8" y="9" width="1" height="1"/>
    <rect x="7" y="10" width="1" height="1"/>
    <rect x="8" y="10" width="1" height="1"/>
    <rect x="9" y="10" width="1" height="1"/>
    <rect x="8" y="11" width="1" height="1"/>
    <rect x="9" y="11" width="1" height="1"/>
    <rect x="10" y="11" width="1" height="1"/>
    <rect x="9" y="12" width="1" height="1"/>
    <rect x="10" y="12" width="1" height="1"/>
    <rect x="11" y="12" width="1" height="1"/>
    <rect x="10" y="13" width="1" height="1"/>
  </g>
</svg>
