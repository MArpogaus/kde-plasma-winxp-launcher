<?xml version="1.0" encoding="UTF-8"?>
<!-- Windows XP menu arrows (4 x 7 px), in the text colour. Part of the Windows XP pack, replacing Exposé's. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="8" viewBox="0 0 40 8">
<style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#000000; }</style>
<g id="right-arrow" class="ColorScheme-Text" style="fill:currentColor"><rect x="0" y="0" width="1" height="7"/><rect x="1" y="1" width="1" height="5"/><rect x="2" y="2" width="1" height="3"/><rect x="3" y="3" width="1" height="1"/></g>
<g id="left-arrow" class="ColorScheme-Text" style="fill:currentColor"><rect x="10" y="3" width="1" height="1"/><rect x="11" y="2" width="1" height="3"/><rect x="12" y="1" width="1" height="5"/><rect x="13" y="0" width="1" height="7"/></g>
<g id="down-arrow" class="ColorScheme-Text" style="fill:currentColor"><rect x="20" y="0" width="7" height="1"/><rect x="21" y="1" width="5" height="1"/><rect x="22" y="2" width="3" height="1"/><rect x="23" y="3" width="1" height="1"/></g>
<g id="up-arrow" class="ColorScheme-Text" style="fill:currentColor"><rect x="33" y="0" width="1" height="1"/><rect x="32" y="1" width="3" height="1"/><rect x="31" y="2" width="5" height="1"/><rect x="30" y="3" width="7" height="1"/></g>
</svg>
