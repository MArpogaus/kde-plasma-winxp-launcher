<?xml version="1.0" encoding="UTF-8"?>
<!-- Windows XP text field: white, 1 px #7f9db9 border (no hover or focus
     look, like XP's).
     Part of the Windows XP pack, replacing Exposé's. -->
<svg xmlns="http://www.w3.org/2000/svg" width="45" height="13" viewBox="0 0 45 13">
<g id="base-topleft"><rect x="0" y="0" width="1" height="1" fill="#000" fill-opacity="0"/><rect x="0" y="0" width="1" height="1" fill="#7f9db9"/></g>
<g id="base-top"><rect x="3" y="0" width="1" height="1" fill="#000" fill-opacity="0"/><rect x="3" y="0" width="1" height="1" fill="#7f9db9"/></g>
<g id="base-topright"><rect x="6" y="0" width="1" height="1" fill="#000" fill-opacity="0"/><rect x="6" y="0" width="1" height="1" fill="#7f9db9"/></g>
<g id="base-left"><rect x="9" y="0" width="1" height="7" fill="#000" fill-opacity="0"/><rect x="9" y="0" width="1" height="1.5" fill="#7f9db9"/><rect x="9" y="1" width="1" height="1.5" fill="#7f9db9"/><rect x="9" y="2" width="1" height="1.5" fill="#7f9db9"/><rect x="9" y="3" width="1" height="1.5" fill="#7f9db9"/><rect x="9" y="4" width="1" height="1.5" fill="#7f9db9"/><rect x="9" y="5" width="1" height="1.5" fill="#7f9db9"/><rect x="9" y="6" width="1" height="1" fill="#7f9db9"/></g>
<g id="base-center"><rect x="12" y="0" width="1" height="7" fill="#000" fill-opacity="0"/><rect x="12" y="0" width="1" height="1.5" fill="#ffffff"/><rect x="12" y="1" width="1" height="1.5" fill="#ffffff"/><rect x="12" y="2" width="1" height="1.5" fill="#ffffff"/><rect x="12" y="3" width="1" height="1.5" fill="#ffffff"/><rect x="12" y="4" width="1" height="1.5" fill="#ffffff"/><rect x="12" y="5" width="1" height="1.5" fill="#ffffff"/><rect x="12" y="6" width="1" height="1" fill="#ffffff"/></g>
<g id="base-right"><rect x="15" y="0" width="1" height="7" fill="#000" fill-opacity="0"/><rect x="15" y="0" width="1" height="1.5" fill="#7f9db9"/><rect x="15" y="1" width="1" height="1.5" fill="#7f9db9"/><rect x="15" y="2" width="1" height="1.5" fill="#7f9db9"/><rect x="15" y="3" width="1" height="1.5" fill="#7f9db9"/><rect x="15" y="4" width="1" height="1.5" fill="#7f9db9"/><rect x="15" y="5" width="1" height="1.5" fill="#7f9db9"/><rect x="15" y="6" width="1" height="1" fill="#7f9db9"/></g>
<g id="base-bottomleft"><rect x="18" y="0" width="1" height="1" fill="#000" fill-opacity="0"/><rect x="18" y="0" width="1" height="1" fill="#7f9db9"/></g>
<g id="base-bottom"><rect x="21" y="0" width="1" height="1" fill="#000" fill-opacity="0"/><rect x="21" y="0" width="1" height="1" fill="#7f9db9"/></g>
<g id="base-bottomright"><rect x="24" y="0" width="1" height="1" fill="#000" fill-opacity="0"/><rect x="24" y="0" width="1" height="1" fill="#7f9db9"/></g>
<rect id="base-hint-left-margin" x="27" y="0" width="4" height="1" fill="#000" fill-opacity="0"/>
<rect id="base-hint-top-margin" x="33" y="0" width="1" height="3" fill="#000" fill-opacity="0"/>
<rect id="base-hint-right-margin" x="36" y="0" width="4" height="1" fill="#000" fill-opacity="0"/>
<rect id="base-hint-bottom-margin" x="42" y="0" width="1" height="3" fill="#000" fill-opacity="0"/>
</svg>
