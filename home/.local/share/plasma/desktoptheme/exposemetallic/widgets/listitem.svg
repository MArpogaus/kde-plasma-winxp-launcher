<svg xmlns="http://www.w3.org/2000/svg" width="48" height="88" viewBox="0 0 48 88">
<style id="current-color-scheme" type="text/css">.ColorScheme-Highlight { color:#b2b4bf; }</style>
<rect id="normal-topleft" x="0" y="0" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor" fill-opacity="0"/>
