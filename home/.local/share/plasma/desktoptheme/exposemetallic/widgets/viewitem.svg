<?xml version="1.0" encoding="UTF-8"?>
<!-- Highlight for Plasma's own lists, as XP-era hot tracking: a 1 px frame in
     the highlight colour around a 30 % (hover) or 50 % (selected) tint of it,
     so their text stays black. (The XP menus' solid highlight is in
     widgets/winxp.) Part of the Windows XP pack (XP's Silver scheme), replacing Exposé's. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="64" viewBox="0 0 40 64">
<style id="current-color-scheme" type="text/css">.ColorScheme-Highlight { color:#b2b4bf; }</style>
<rect id="hover-topleft" x="0" y="0" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="hover-top" x="1" y="0" width="10" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="hover-topright" x="11" y="0" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="hover-left" x="0" y="1" width="1" height="10" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="hover-center" x="1" y="1" width="10" height="10" class="ColorScheme-Highlight" style="fill:currentColor" fill-opacity="0.3"/>
<rect id="hover-right" x="11" y="1" width="1" height="10" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="hover-bottomleft" x="0" y="11" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="hover-bottom" x="1" y="11" width="10" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="hover-bottomright" x="11" y="11" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="hover-hint-top-margin" x="20" y="0" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="hover-hint-bottom-margin" x="23" y="0" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="hover-hint-left-margin" x="26" y="0" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="hover-hint-right-margin" x="29" y="0" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="selected-topleft" x="0" y="20" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected-top" x="1" y="20" width="10" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected-topright" x="11" y="20" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected-left" x="0" y="21" width="1" height="10" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected-center" x="1" y="21" width="10" height="10" class="ColorScheme-Highlight" style="fill:currentColor" fill-opacity="0.5"/>
<rect id="selected-right" x="11" y="21" width="1" height="10" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected-bottomleft" x="0" y="31" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected-bottom" x="1" y="31" width="10" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected-bottomright" x="11" y="31" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected-hint-top-margin" x="20" y="20" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="selected-hint-bottom-margin" x="23" y="20" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="selected-hint-left-margin" x="26" y="20" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="selected-hint-right-margin" x="29" y="20" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="selected+hover-topleft" x="0" y="40" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected+hover-top" x="1" y="40" width="10" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected+hover-topright" x="11" y="40" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected+hover-left" x="0" y="41" width="1" height="10" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected+hover-center" x="1" y="41" width="10" height="10" class="ColorScheme-Highlight" style="fill:currentColor" fill-opacity="0.5"/>
<rect id="selected+hover-right" x="11" y="41" width="1" height="10" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected+hover-bottomleft" x="0" y="51" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected+hover-bottom" x="1" y="51" width="10" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected+hover-bottomright" x="11" y="51" width="1" height="1" class="ColorScheme-Highlight" style="fill:currentColor"/>
<rect id="selected+hover-hint-top-margin" x="20" y="40" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="selected+hover-hint-bottom-margin" x="23" y="40" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="selected+hover-hint-left-margin" x="26" y="40" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
<rect id="selected+hover-hint-right-margin" x="29" y="40" width="1" height="1" fill="#00ff00" fill-opacity="0"/>
</svg>
